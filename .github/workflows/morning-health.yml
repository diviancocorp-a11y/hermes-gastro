name: Morning Health Check

# Lunes a sabado 10:00 UTC = 7:00 AM Argentina (UTC-3).
# Salud del EDIFICIO (Dico) a Telegram: landing, tenants, submit-order,
# drift de schema y Sentry. Los 3 proyectos legacy estan pausados a proposito
# y ya no se chequean (daban rojo todas las mananas = ruido).
#
# OJO: el cron corre desde la rama DEFAULT (main). Hasta que main y
# platform/runtime-tenant converjan, probarlo con workflow_dispatch eligiendo
# la rama platform/runtime-tenant.
on:
  schedule:
    - cron: '0 10 * * 1-6'
  workflow_dispatch: # permite correrlo manualmente desde la UI
    inputs:
      probar_cerebro:
        description: 'Llamar a DICO_BRAIN con un problema de ejemplo aunque todo este en verde'
        type: boolean
        default: false

jobs:
  health:
    name: Health check + notify Telegram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run health check
        run: node scripts/morning-health.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Los negocios salen de la base (scripts/tenants-vivos.mjs). La
          # variable queda de respaldo si falta la service role.
          SMOKE_TENANTS: ${{ vars.SMOKE_TENANTS }}
          # Opcional: API key de OpenAI que explica los problemas en castellano.
          DICO_BRAIN: ${{ secrets.DICO_BRAIN }}
          PROBAR_CEREBRO: ${{ inputs.probar_cerebro }}
          # Opcional: habilita el check de drift del snapshot del edificio.
          PLATFORM_SUPABASE_URL: ${{ secrets.PLATFORM_SUPABASE_URL }}
          PLATFORM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLATFORM_SUPABASE_SERVICE_ROLE_KEY }}
          # Opcional: habilita el resumen de errores de Sentry (24h).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
