name: Morning Health Check

# Tres turnos (Argentina = UTC-3), pedido de Ricky el 20/oct: en el dia
# pasan cosas que el reporte de la manana no ve.
#   manana: L-S 7:00 AR (10:00 UTC), Sentry de las ultimas 24h
#   tarde:  todos los dias 15:00 AR (18:00 UTC), Sentry de las ultimas 8h
#   noche:  todos los dias 21:00 AR (00:00 UTC), Sentry de las ultimas 8h
# Salud del EDIFICIO (Dico) a Telegram: landing, tenants, submit-order,
# drift de schema y Sentry. Los 3 proyectos legacy estan pausados a proposito
# y ya no se chequean (daban rojo todas las mananas = ruido).
#
# OJO: el cron corre desde la rama DEFAULT (main), y GitHub lo atrasa: el
# de las 7:00 del 20/oct salio 11:41. El turno sale del cron que disparo, no
# de la hora, para que un atraso no le cambie el nombre.
on:
  schedule:
    - cron: '0 10 * * 1-6'
    - cron: '0 18 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch: # permite correrlo manualmente desde la UI
    inputs:
      turno:
        description: 'Que reporte simular (cambia el titulo y la ventana de Sentry)'
        type: choice
        options: [manana, tarde, noche]
        default: manana
      probar_cerebro:
        description: 'Llamar a DICO_BRAIN con un problema de ejemplo aunque todo este en verde'
        type: boolean
        default: false
      probar_alerta:
        description: 'Mandar un error de prueba a Sentry: tiene que llegar el aviso de GerenteDico'
        type: boolean
        default: false

jobs:
  health:
    name: Health check + notify Telegram
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run health check
        run: node scripts/morning-health.mjs
        env:
          # El bot es GerenteDico: su token esta en el secret GERENTEDICOBOT
          # (16/oct). TELEGRAM_BOT_TOKEN queda de respaldo.
          TELEGRAM_BOT_TOKEN: ${{ secrets.GERENTEDICOBOT || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURNO: ${{ github.event.schedule == '0 18 * * *' && 'tarde' || github.event.schedule == '0 0 * * *' && 'noche' || inputs.turno || 'manana' }}
          # Los negocios salen de la base (scripts/tenants-vivos.mjs). La
          # variable queda de respaldo si falta la service role.
          SMOKE_TENANTS: ${{ vars.SMOKE_TENANTS }}
          # Opcional: API key de OpenAI que explica los problemas en castellano.
          DICO_BRAIN: ${{ secrets.DICO_BRAIN }}
          PROBAR_CEREBRO: ${{ inputs.probar_cerebro }}
          PROBAR_ALERTA: ${{ inputs.probar_alerta }}
          # Opcional: habilita el check de drift del snapshot del edificio.
          PLATFORM_SUPABASE_URL: ${{ secrets.PLATFORM_SUPABASE_URL }}
          PLATFORM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLATFORM_SUPABASE_SERVICE_ROLE_KEY }}
          # Opcional: habilita el resumen de errores de Sentry (24h).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Para buscar en los PRs abiertos el archivo de una migracion o una
          # funcion que falta (scripts/pendientes-en-pr.mjs). Solo lectura.
          GH_TOKEN: ${{ github.token }}
