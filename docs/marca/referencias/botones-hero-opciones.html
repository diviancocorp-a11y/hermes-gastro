  #dico-cta-options .dico-cta-stage {
    --cta-bg: #09090b;
    --cta-zinc: #18181b;
    --cta-zinc-raised: #27272a;
    --cta-ink: #faf5ee;
    --cta-gold: #e0ac3c;
    --cta-focus: var(--cta-gold);
    --cta-space-1: 4px;
    --cta-space-2: 8px;
    --cta-space-4: 16px;
    --cta-space-6: 24px;
    --cta-space-8: 32px;
    --cta-radius-pill: 999px;
    --cta-duration: 240ms;
    --cta-ease: cubic-bezier(.22, 1, .36, 1);
    --cta-height: 56px;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    height: 220px;
    padding: var(--cta-space-6);
    background: var(--cta-bg);
    color: var(--cta-ink);
    font-family: 'Overused Grotesk', system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.2;
    font-weight: 500;
  }

  #dico-cta-options .dico-cta {
    appearance: none;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-wrap: nowrap;
    min-height: var(--cta-height);
    margin: 0;
    border: 0;
    padding: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  #dico-cta-options .dico-cta:focus-visible {
    outline: 3px solid var(--cta-focus);
    outline-offset: 6px;
  }

  #dico-cta-options .dico-cta__label,
  #dico-cta-options .dico-cta__arrow,
  #dico-cta-options .dico-cta__arrow svg {
    transition: transform var(--cta-duration) var(--cta-ease);
  }

  #dico-cta-options .dico-cta__arrow {
    box-sizing: border-box;
    display: grid;
    flex: 0 0 auto;
    place-items: center;
    border-radius: var(--cta-radius-pill);
  }

  #dico-cta-options .dico-cta__arrow svg {
    width: var(--cta-space-6);
    height: var(--cta-space-6);
    stroke-width: 1.75;
  }

  #dico-cta-options .dico-cta--ivory {
    gap: var(--cta-space-6);
    border-radius: var(--cta-radius-pill);
    padding: var(--cta-space-2);
    padding-left: var(--cta-space-8);
    background: var(--cta-ink);
    color: var(--cta-zinc);
  }

  #dico-cta-options .dico-cta--ivory .dico-cta__arrow {
    width: 40px;
    height: 40px;
    margin-right: var(--cta-space-2);
    background: var(--cta-zinc);
    color: var(--cta-ink);
  }

  #dico-cta-options .dico-cta--ivory:is(:hover, :focus-visible, :active, .is-testing) .dico-cta__arrow {
    transform: translateX(var(--cta-space-2));
  }

  #dico-cta-options .dico-cta--split {
    gap: var(--cta-space-2);
  }

  #dico-cta-options .dico-cta--split .dico-cta__label {
    display: grid;
    place-items: center;
    min-height: var(--cta-height);
    padding-inline: var(--cta-space-6);
    background: var(--cta-zinc-raised);
    color: var(--cta-ink);
  }

  #dico-cta-options .dico-cta--split .dico-cta__arrow {
    width: var(--cta-height);
    height: var(--cta-height);
    background: var(--cta-gold);
    color: var(--cta-bg);
  }

  #dico-cta-options .dico-cta--split:is(:hover, :focus-visible, :active, .is-testing) .dico-cta__arrow svg {
    transform: rotate(45deg);
  }

  #dico-cta-options .dico-cta:active .dico-cta__label {
    transform: translateY(1px);
  }

  @media (prefers-reduced-motion: reduce) {
    #dico-cta-options .dico-cta__label,
    #dico-cta-options .dico-cta__arrow,
    #dico-cta-options .dico-cta__arrow svg {
      transition: none;
    }

    #dico-cta-options .dico-cta--ivory:is(:hover, :focus-visible, :active, .is-testing) .dico-cta__arrow,
    #dico-cta-options .dico-cta--split:is(:hover, :focus-visible, :active, .is-testing) .dico-cta__arrow svg,

<div id="dico-cta-options" class="viz-carousel viz-dotted-background" aria-label="Opciones del boton Quiero Dico" data-previous-label="Anterior" data-next-label="Siguiente">
  <section data-variant="Marfil en movimiento" aria-label="Marfil en movimiento">
    <div class="dico-cta-stage">
      <button class="dico-cta dico-cta--ivory cursor-interaction" type="button" aria-label="Quiero Dico, probar movimiento marfil">
        <span class="dico-cta__label">Quiero Dico</span>
        <span class="dico-cta__arrow" aria-hidden="true"><i data-lucide="arrow-right"></i></span>
      </button>
    </div>
  </section>
  <section data-variant="Zinc y oro" aria-label="Zinc y oro" hidden>
    <div class="dico-cta-stage">
      <button class="dico-cta dico-cta--split cursor-interaction" type="button" aria-label="Quiero Dico, probar movimiento zinc y oro">
        <span class="dico-cta__label">Quiero Dico</span>
        <span class="dico-cta__arrow" aria-hidden="true"><i data-lucide="arrow-up-right"></i></span>
      </button>
    </div>
  </section>
</div>

<script>
  (() => {
    const root = document.getElementById('dico-cta-options');
    const buttons = root.querySelectorAll('.dico-cta');

    buttons.forEach((button) => {
      let animationTimer;
      const settings = { duration: 240 };
      const render = () => button.style.setProperty('--cta-duration', `${settings.duration}ms`);

      render();
      button.addEventListener('click', () => {
        clearTimeout(animationTimer);
        button.classList.add('is-testing');
        animationTimer = setTimeout(() => button.classList.remove('is-testing'), settings.duration);
      });

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: button, onChange: render });
        tweak.addSlider(settings, 'duration', {
          label: 'Duracion', min: 160, max: 480, step: 20, unit: 'ms', reference: '--cta-duration'
        });
      }
    });
  })();
</script>
